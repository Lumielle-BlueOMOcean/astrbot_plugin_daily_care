name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests - Python 3.12
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Show Python version
        run: python --version

      - name: Compile source tree
        run: python -m compileall .

      - name: Run core tests
        run: python tests/test_core.py

      - name: Check committed diff whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero_sha="0000000000000000000000000000000000000000"
          valid_sha() {
            [[ "$1" =~ ^[0-9a-fA-F]{40}$ ]] && [[ "$1" != "$zero_sha" ]]
          }

          if [[ "$EVENT_NAME" == "pull_request" ]] && valid_sha "$PR_BASE_SHA" && valid_sha "$PR_HEAD_SHA"; then
            git diff --check "$PR_BASE_SHA" "$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]] && valid_sha "$PUSH_BEFORE_SHA" && valid_sha "$CURRENT_SHA"; then
            git diff --check "$PUSH_BEFORE_SHA" "$CURRENT_SHA"
          else
            git diff-tree --check --no-commit-id -r HEAD
          fi

  astrbot-runtime-smoke:
    name: AstrBot 4.25.5 runtime smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check out AstrBot v4.25.5
        uses: actions/checkout@v6
        with:
          repository: AstrBotDevs/AstrBot
          ref: v4.25.5
          path: .ci/AstrBot
          fetch-depth: 1
          persist-credentials: false

      - name: Verify AstrBot checkout
        working-directory: .ci/AstrBot
        run: |
          python - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          tag = subprocess.check_output(
              ["git", "describe", "--tags", "--exact-match", "HEAD"],
              text=True,
          ).strip()
          assert version == "4.25.5", version
          assert tag == "v4.25.5", tag
          print(f"AstrBot source verified: {tag} ({version})")
          PY

      - name: Install runtime smoke dependencies
        run: python -m pip install --disable-pip-version-check -r ci/runtime-smoke-requirements.txt

      - name: Run AstrBot runtime smoke
        env:
          ASTRBOT_SOURCE: .ci/AstrBot
        run: python tests/runtime_smoke.py
